name: Auto Update Clash Nodes

on:
  schedule:
    # 每天早晚自动定时运行两次 (UTC 22:00 = 北京时间 06:00, UTC 10:00 = 北京时间 18:00)
    - cron: '0 22,10 * * *'
  workflow_dispatch: # 支持在 GitHub 仓库 Actions 页面上手动点击运行测试
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - 'fetch_meta_pro.py'

permissions:
  contents: write

jobs:
  update-nodes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Mihomo Core
        run: |
          echo "[*] 正在安装 Mihomo 内核..."
          MIHOMO_URL="https://github.com/MetaCubeX/mihomo/releases/download/v1.19.10/mihomo-linux-amd64-v1.19.10.gz"
          curl -sSL -o mihomo.gz "$MIHOMO_URL"
          gzip -d mihomo.gz
          chmod +x mihomo
          sudo mv mihomo /usr/local/bin/mihomo
          mihomo -v

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Node Fetch & Speedtest
        run: |
          python fetch_meta_pro.py

      - name: Commit and Push to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/clash_meta_30.yaml public/sub.txt public/sub
          if git diff --staged --quiet; then
            echo "[*] 节点未发生变化，跳过提交"
          else
            git commit -m "chore: auto update clash_meta_30.yaml [skip ci]"
            git push
          fi
